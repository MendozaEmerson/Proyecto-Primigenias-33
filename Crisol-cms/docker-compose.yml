version: '3.8'

services:
  strapi:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: crisol-strapi-dev
    ports:
      - 1337:1337
    environment:
      - DATABASE_CLIENT=sqlite
      - DATABASE_FILENAME=.tmp/data.db
      - JWT_SECRET=crisol_jwt_secret_dev_2026
      - ADMIN_JWT_SECRET=crisol_admin_jwt_secret_dev_2026
      - APP_KEYS=key1,key2,key3,key4
      - API_TOKEN_SALT=crisol_api_token_salt_2026
    volumes:
      - ./app:/opt/app
      - strapi_node_modules:/opt/app/node_modules
    restart: unless-stopped

volumes:
  strapi_node_modules:
